[build]
  # Fetch the sheet and write the public dataset into public/ so Vite copies it
  # into dist/. SHEET_CSV_EXPORT_URL is set in Netlify's environment variables.
  # If the fetch fails the build fails, so the previous deploy stays live.
  command = "npm run pipeline:publish -- public/data && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# US-26: the public dataset files. A short max-age (SHEET_FETCH_INTERVAL_MINUTES
# * 60, i.e. 15 minutes) means visitors see a new deploy's data within one fetch
# interval; must-revalidate stops browsers serving a stale copy after that.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=900, must-revalidate"
