name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the diff on pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.

            Look for correctness bugs and clear reuse/simplification/efficiency issues.
            Do all research and tool calls yourself, directly and synchronously -
            never launch a background or async subagent to check PR status or
            anything else, since this session cannot be resumed once a background
            task completes.

            Post findings as inline comments on the pull request using the
            available GitHub inline-comment tool. If you find no issues, post one
            short top-level comment saying the diff looks fine instead of leaving
            any comments.
          claude_args: '--max-turns 15 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
