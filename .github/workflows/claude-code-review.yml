name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the diff on pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.

            Check these:
            1. Correctness bugs.
            2. Clear reuse/simplification/efficiency issues.
            3. Staff-only field leakage (high severity): none of `observerId`,
               `observerEmail`, `observerFirstName`, `observerLastName`, or
               `notes` may appear in any code path that produces public output -
               public API responses, generated public dataset files
               (sites.json, observations.json, PublicSiteSummary), or any
               component that renders to the public map/embed.
            4. Test coverage: if the PR title or description references a ticket
               (e.g. "US-07", "#12"), fetch that issue with `gh issue view` and
               check whether the PR's tests cover its "Test-first (TDD)
               checklist" items. If no ticket is referenced, check whether the
               new/changed logic has any corresponding tests at all.

            Do all research and tool calls yourself, directly and synchronously -
            never launch a background or async subagent to check PR status or
            anything else, since this session cannot be resumed once a background
            task completes.

            Post findings as inline comments on the pull request using the
            available GitHub inline-comment tool. If you find no issues, post one
            short top-level comment saying the diff looks fine instead of leaving
            any comments.
          claude_args: '--max-turns 15 --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),mcp__github_inline_comment__create_inline_comment"'
